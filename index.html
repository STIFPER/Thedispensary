      /* Loading skeleton */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: #1d1e1e;
        z-index: 9999;
        display: flex;
        align-items: center;

      #loading-screen.hidden {

      .loading-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #a0d4b2;
        margin: 0 4px;
        animation: dotBounce 0.8s infinite alternate;
      }
      .loading-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loading-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes dotBounce {
        from {
          opacity: 0.3;
          transform: translateY(0);
        }
        to {
          opacity: 1;
          transform: translateY(-8px);
        }
      }

      /* 🎃 HALLOWEEN CAMPAIGN — header decoration only (see HalloweenHeader).
         Remove this block, the Halloween* components and HALLOWEEN_ON to retire
         it; it also switches itself off after HALLOWEEN_END in the script. */
      .hw-glow {
        animation: hwGlow 5s ease-in-out infinite;
      }
      @keyframes hwGlow {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(1);
        }
        50% {
          opacity: 0.95;
          transform: scale(1.06);
        }
      }
      /* candle flicker: stepped so it stutters like a flame, not a pulse */
      /* candle flicker: stepped so it stutters like a flame, not a pulse */
      .hw-flicker {
        animation: hwFlicker 3.4s steps(1, end) infinite;
      }
      @keyframes hwFlicker {
        0%,
        100% {
          filter: drop-shadow(0 0 7px rgba(255, 122, 26, 0.85));
        }
        12% {
          filter: drop-shadow(0 0 3px rgba(255, 122, 26, 0.5));
        }
        24% {
          filter: drop-shadow(0 0 9px rgba(255, 150, 50, 0.95));
        }
        41% {
          filter: drop-shadow(0 0 4px rgba(255, 122, 26, 0.6));
        }
        63% {
          filter: drop-shadow(0 0 8px rgba(255, 140, 40, 0.9));
        }
        80% {
          filter: drop-shadow(0 0 5px rgba(255, 122, 26, 0.65));
        }
      }
      /* Fliers (bats, ghosts, Baba Yaga) live in two side "zones" — the gutters
         either side of the centred title — so nothing ever flies across text.
         Outer element crosses its zone (animating `left` so the % is the zone's
         width), inner one bobs, svg flaps.
         The zones sit in a full-bleed stage (see HalloweenLayer), so the OUTER
         edge is the real screen edge: fliers come in from / leave off-screen.
         The INNER edge (towards the title) is a soft mask fade instead of a hard
         clip — a clip there sliced fliers in half in the middle of the page. */
      .hw-zone {
        position: absolute;
        top: 0;
        bottom: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .hw-zone-l {
        left: 0;
        width: calc(50% - 215px);
        -webkit-mask-image: linear-gradient(to right, #000 0%, #000 60%, transparent 100%);
        mask-image: linear-gradient(to right, #000 0%, #000 60%, transparent 100%);
      }
      .hw-zone-r {
        right: 0;
        width: calc(50% - 215px);
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 40%, #000 100%);
        mask-image: linear-gradient(to right, transparent 0%, #000 40%, #000 100%);
      }
      .hw-bat-x {
        position: absolute;
        left: 0;
        --hw-bob: 26px;
        animation: hwFlyX linear infinite;
      }
      @keyframes hwFlyX {
        from {
          left: -100px;
        }
        to {
          left: 100%;
        }
      }
      .hw-bat-y {
        animation: hwFlyY ease-in-out infinite alternate;
      }
      @keyframes hwFlyY {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(var(--hw-bob, 26px));
        }
      }
      /* Phones have no gutters (the title fills the width), so the only free
         space is a thin strip above the badge: keep just a couple of small bats
         there and hide everything else. */
      @media (max-width: 1023px) {
        .hw-zone-l {
          left: 0;
          right: 0;
          bottom: auto;
          width: auto;
          height: 30px;
          -webkit-mask-image: none;
          mask-image: none;
        }
        .hw-zone-r {
          display: none;
        }
        .hw-bat-x {
          top: 4px !important;
          --hw-bob: 5px;
        }
      }
      .hw-wing {
        transform-origin: center;
        animation: hwFlap 0.32s ease-in-out infinite alternate;
      }
      @keyframes hwFlap {
        from {
          transform: scaleY(1);
        }
        to {
          transform: scaleY(0.45);
        }
      }
      .hw-spider {
        transform-origin: top center;
        animation: hwDangle 3.8s ease-in-out infinite alternate;
      }
      @keyframes hwDangle {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(18px);
        }
      }
      /* Own class rather than Tailwind's `hidden lg:block`: navbar.html ships a
         legacy `.hidden { display:none !important }` that beats lg:block. */
      .hw-wide {
        display: none;
      }
      @media (min-width: 1024px) {
        .hw-wide {
          display: block;
        }
      }
      .hw-spider-sm {
        transform-origin: top center;
        animation: hwDangleSm 3.2s ease-in-out infinite alternate;
      }
      @keyframes hwDangleSm {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(7px);
        }
      }
      .hw-float {
        animation: hwFloat 4.2s ease-in-out infinite alternate;
      }
      @keyframes hwFloat {
        from {
          transform: translateY(0) rotate(-3deg);
        }
        to {
          transform: translateY(-14px) rotate(3deg);
        }
      }
      /* small floating ghost beside box titles */
      .hw-float-sm {
        animation: hwFloatSm 3.4s ease-in-out infinite alternate;
      }
      @keyframes hwFloatSm {
        from {
          transform: translateY(1px) rotate(-4deg);
        }
        to {
          transform: translateY(-3px) rotate(4deg);
        }
      }
      .hw-twinkle {
        animation: hwTwinkle 2.8s ease-in-out infinite;
      }
      @keyframes hwTwinkle {
        0%,
        100% {
          opacity: 0.12;
        }
        50% {
          opacity: 0.95;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hw-glow,
        .hw-flicker,
        .hw-bat-y,
        .hw-wing,
        .hw-spider,
        .hw-spider-sm,
        .hw-float-sm,
        .hw-float,
        .hw-twinkle {
          animation: none;
        }
        .hw-bat-x {
          display: none;
        }
